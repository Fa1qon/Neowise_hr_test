<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    #message { margin: 1rem 0; padding: .5rem .75rem; border-radius: .25rem; }
    #message:empty { display: none; }
    #message[data-state="ready"] { background: #e8f5e9; }
    #message[data-state="manual_review"],
    #message[data-state="error"] { background: #fff3e0; }
    #message[data-state="invalid_input"] { background: #ffebee; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="request-text">Текст заявки</label>
    <textarea id="request-text" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>

  <p id="message" role="status" aria-live="polite"></p>

  <section id="result" hidden>
    <p>Тема: <strong id="topic"></strong></p>
    <label for="draft">Черновик ответа</label>
    <textarea id="draft" rows="6"></textarea>
  </section>

  <script type="module">
    import { LOADING_VIEW, render, viewFor } from "/ui.mjs";

    const form = document.querySelector("form");
    const button = form.querySelector("button");
    const elements = {
      message: document.querySelector("#message"),
      topic: document.querySelector("#topic"),
      draft: document.querySelector("#draft"),
      result: document.querySelector("#result"),
    };

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      // Сразу убираем прошлый результат, чтобы старый черновик не висел, пока идёт новый разбор.
      render(elements, LOADING_VIEW);
      let view;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: document.querySelector("#request-text").value }),
        });
        const body = await reply.json().catch(() => null);
        view = viewFor(reply.status, body);
      } catch {
        view = viewFor(0, null);
      } finally {
        button.disabled = false;
      }
      render(elements, view);
    });
  </script>
</body>
</html>
